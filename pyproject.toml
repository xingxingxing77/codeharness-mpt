[project]
name = "codeharness"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6", "pydantic-settings>=2.2",
    "langchain>=0.2", "langchain-openai>=0.1", "langchain-community>=0.2",
    "langchain-qdrant>=0.1", "langgraph>=0.1",
    "qdrant-client>=1.7", "loguru>=0.7", "shortuuid>=1.0", "tiktoken",
    # 复制件带出的依赖：utils/common.py（源逐字复制件）import 了前 6 个，
    # 不声明则新环境 pip install -e . 后 import codeharness.utils.common 直接 ModuleNotFoundError
    "aiofiles>=23.0", "aiohttp>=3.9", "chardet>=5.0", "requests>=2.31", "pillow>=10.0", "tenacity>=8.2",
    "pandas>=2.0",    # document.py 的 IndexableDocument / read_data
    "redis>=5.0",     # utils/redis.py（源语义客户端）+ S7 平台层
    "gitignore-parser>=0.1",   # utils/{tree,file,repo_to_markdown}.py 顶层 import，漏声明则三件 import 即炸
    "anthropic>=0.25",         # utils/token_counter.py 顶层 import（本机靠别的包带入才没暴露）
    # 漏声明的后果不是报错而是**装完起不来**：`server/api/workspace.py:6` 吃 `UploadFile`/`File`，
    # FastAPI 在 import `server.app` 时就 `RuntimeError: Form data requires "python-multipart"`。
    # 本机照样没暴露（`pip show python-multipart` → `Required-by: mcp`），是 09-23 第一次
    # `docker build` 出一个干净 backend 镜像跑 `import server.app` 才当场炸出来。
    "python-multipart>=0.0.9",
    # 持久化断点：runner 走 astream_events，只能用 AsyncSqliteSaver，而它运行时依赖 aiosqlite。
    # 漏装 aiosqlite 时工厂会静默退回内存型 —— 表现为"重启后丢进度"，而不是报错，所以必须声明。
    "langgraph-checkpoint-sqlite>=2.0", "aiosqlite>=0.20",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]", "sse-starlette"]
dev = ["pytest", "pytest-asyncio", "ruff"]
# N9 外部可观测（自托管 Langfuse v4）：不进主依赖——未装时 codeharness/observability.py
# 整模块降级为 no-op。>=4.7 是 session/user/tags 能落到 observation 的最低版；SDK v4 要 Python>=3.11
observability = ["langfuse>=4.7,<5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["codeharness*"]