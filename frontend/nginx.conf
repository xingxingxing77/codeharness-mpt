# 前端容器的两件事：SPA 静态托管 + 把 /api 与 /workspace 反代到 backend:8000。
# 反代不是可有可无的方便——`vite.config.ts` 开发期就靠同一份代理，`api/client.ts` 发的是相对路径。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 知识库上传是**唯一**合法的大 body 入口：业务上限 20 文件 × 20MB（那组数住在
    # `server/api/workspace.py` 的 MAX_UPLOAD_BYTES/MAX_UPLOAD_FILES，这里不重抄数字）⇒ 本层必须
    # 放到 ≥ 400MB，否则多文件一次传会被**裸 413** 掐在网关层、走不到 `upload_kb` 的逐条 `errors[]`
    # 回执（C88：原先写 25m，是按「单文件 20MB」算的，漏了件数乘数）。后端另有一道按
    # content-type 分档的入口 body 闸（`server/app.py::guard_body_size`），它的上传档 = 同一组数。
    client_max_body_size 420m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE（`/api/sessions/{sid}/events`）：这三条一起才成立——
    # 关缓冲否则事件被 nginx 攒着不下发；1.1 + 空 Connection 否则 keep-alive 被断；
    # 长读超时否则一场长会话跑到一半连接就被掐（默认 60s）。
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /workspace/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
